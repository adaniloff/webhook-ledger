name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: app
          MARIADB_USER: app
          MARIADB_PASSWORD: app
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://app:app@127.0.0.1:3306/app?serverVersion=10.11.0-MariaDB&charset=utf8mb4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, iconv, intl, zip, pdo_mysql, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Coding standards (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse src --level=max --ansi

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit
